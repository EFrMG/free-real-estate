# Every step runs against local files or Miniflare's throwaway D1/R2.
name: Run Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Uses the version pinned by `packageManager` in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (frontend, backend + tests, shared)
        run: pnpm typeck

      - name: Backend tests (local D1/R2 via Miniflare)
        run: pnpm test

      - name: Frontend build
        run: pnpm build:fe

      - name: Backend dry-run bundle
        run: pnpm build:be
